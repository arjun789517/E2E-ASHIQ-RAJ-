<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R4J M1SHR4 - Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="main-header">
            <h1>🔥 R4J M1SHR4 🔥</h1>
            <p>PREMIUM FACEBOOK MESSAGE AUTOMATION TOOL</p>
        </div>
        <div class="sidebar">
            <div class="sidebar-header">👤 USER DASHBOARD</div>
            <div><strong>USERNAME:</strong> <span id="username"></span></div>
            <div><strong>USER ID:</strong> <span id="user-id"></span></div>
            <div class="premium-badge">✅ PREMIUM ACCESS</div>
            <button id="logout-btn" class="logout">🚪 LOGOUT</button>
        </div>
        <div class="main-content">
            <div class="tabs">
                <button class="tab-btn active" data-tab="config">⚙️ CONFIGURATION</button>
                <button class="tab-btn" data-tab="automation">🚀 AUTOMATION</button>
            </div>
            <div id="config-tab" class="tab-content active">
                <h2>⚙️ CONFIGURATION SETTINGS</h2>
                <div class="two-columns">
                    <div>
                        <label>CHAT/CONVERSATION ID</label>
                        <input type="text" id="chat-id" placeholder="e.g., 1362400298935018">
                        <label>NAME PREFIX</label>
                        <input type="text" id="name-prefix" placeholder="[R4J M1SHR4]">
                        <label>DELAY (SECONDS)</label>
                        <input type="number" id="delay" min="1" max="300" value="10">
                    </div>
                    <div>
                        <label>FACEBOOK COOKIES (OPTIONAL)</label>
                        <textarea id="cookies" rows="4" placeholder="Paste cookies here"></textarea>
                        <label>MESSAGES (ONE PER LINE)</label>
                        <textarea id="messages" rows="6" placeholder="Hello!&#10;How are you?"></textarea>
                    </div>
                </div>
                <button id="save-config">💾 SAVE CONFIGURATION</button>
            </div>
            <div id="automation-tab" class="tab-content">
                <h2>🚀 AUTOMATION CONTROL</h2>
                <div class="metrics">
                    <div class="metric-card">
                        <div class="metric-value" id="msg-count">0</div>
                        <div class="metric-label">MESSAGES SENT</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value" id="status">🔴 STOPPED</div>
                        <div class="metric-label">STATUS</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value" id="chat-id-display">-</div>
                        <div class="metric-label">CHAT ID</div>
                    </div>
                </div>
                <div class="action-buttons">
                    <button id="start-btn">▶️ START AUTOMATION</button>
                    <button id="stop-btn">⏹️ STOP AUTOMATION</button>
                </div>
                <div class="console-section">
                    <div class="console-header">📡 LIVE CONSOLE OUTPUT</div>
                    <div id="console" class="console-output"></div>
                </div>
            </div>
        </div>
    </div>
    <div class="footer">MADE WITH ❤️ BY R4J M1SHR4 | © 2025</div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
